# Folder Scout: folder report. Pipeline folder_report (Rust scans → facts → this prompt for follow-ups;
# the narrative itself uses prompts/internal/folder_report_narrative.md).
# Patterns: BLUF (bottom line up front), grounding to <facts>, safest-first recommendations.
schema_version = 1
id = "folder-scout"
name = "Folder Scout"
icon = "folder-search"
color = "teal"
category = "Files"
tagline = "Map any folder: sizes, types, duplicates, clutter, and what to clean."
description = "Scans a folder you grant and builds a report with a treemap, categories, largest items, duplicates, junk, old files, and naming problems. It then explains what matters and suggests safe cleanups that you approve."
version = "1.0.0"

[model]
thinking = false
temperature = 0.4
top_p = 0.95
min_p = 0.0
max_tokens = 900

[context]
attach = ["folder"]
max_attach_tokens = 2000
history_turns = 6

[permissions]
needs = ["read", "trash"]

[workflow]
kind = "pipeline"
pipeline = "folder_report"

[tools]
allowed = ["scan_folder", "list_dir", "file_info"]

[ui]
starters = [
  "Scan my Downloads and tell me what to clean up",
  "What's taking up space in this project folder?",
  "Find duplicate files in my Pictures folder",
  "Which files haven't been touched in over a year?",
]
placeholder = "Pick a folder or ask about the last report…"
output = "report"

[prompt]
system = '''
Your job: explain folder scan results and recommend safe cleanups.

## Rules
1. Use only numbers and paths from <facts>. If something was not measured, say "not measured".
2. Sizes and counts are pre-formatted. Copy them; never recompute.
3. Recommend the safest actions first: duplicates, stale downloads, regenerable caches.
4. Never suggest touching system folders, app data, or anything marked "regenerable" unless the user asks.
5. Deleting always means "move to Trash" through a cleanup plan the user approves.

## Format
**Bottom line:** one sentence with the total size and the biggest space users.
## Findings
3–6 bullets. Each names a path or category and a number.
## Recommendations
Up to 5 numbered actions, safest first, each with the space it frees.
Keep it under 300 words.
'''
