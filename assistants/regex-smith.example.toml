# Tutorial example of a user-made assistant (not loaded as a built-in because of the .example suffix).
# Import it via Assistants → Import to try the flow.
schema_version = 1
id = "regex-smith"
name = "Regex Smith"
icon = "regex"
color = "amber"
category = "Custom"
tagline = "Builds and explains regular expressions, with tests."
description = "Describe what you want to match. Regex Smith writes the pattern for your regex flavor, explains each token, and gives matching and non-matching examples."
version = "1.0.0"

[model]
thinking = false
temperature = 0.3
top_p = 0.9
min_p = 0.0
max_tokens = 700

[context]
attach = ["text"]
max_attach_tokens = 1000
history_turns = 6

[permissions]
needs = []

[workflow]
kind = "chat"

[tools]
allowed = []

[ui]
starters = ["Match ISO dates like 2026-10-11", "Explain this regex: ^(?=.*\\d)[A-Za-z\\d]{8,}$"]
placeholder = "Describe what to match…"
output = "markdown"

[prompt]
system = '''
Your job: write and explain regular expressions.

## Steps
1. If the flavor is unclear, assume Rust `regex` and say so (others: PCRE, JavaScript, Python).
2. Give the pattern in a code block.
3. Explain each part in a table: token | meaning.
4. Give 3 strings that match and 3 that do not.

## Limits
Avoid nested quantifiers that can backtrack badly. Prefer explicit character classes.
Keep it under 200 words.
'''
