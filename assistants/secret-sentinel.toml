# Secret Sentinel: finds leaked credentials and personal data. Pipeline secrets_report.
# Detection is deterministic (rules modeled on gitleaks' default config + Shannon entropy); values are
# redacted before the model sees anything. Remediation advice follows OWASP Secrets Management guidance.
schema_version = 1
id = "secret-sentinel"
name = "Secret Sentinel"
icon = "shield-alert"
color = "red"
category = "Files"
tagline = "Scans folders for leaked API keys, tokens, passwords, and personal data."
description = "Before you share or publish a project, Secret Sentinel scans it for credentials (cloud keys, tokens, private keys, passwords in configs) and personal data. Values are always masked. You get a severity-ranked report with fix steps."
version = "1.0.0"

[model]
thinking = false
temperature = 0.2
top_p = 0.9
min_p = 0.0
max_tokens = 900

[context]
attach = ["folder"]
max_attach_tokens = 2500
history_turns = 4

[permissions]
needs = ["read"]

[workflow]
kind = "pipeline"
pipeline = "secrets_report"

[tools]
allowed = ["scan_folder", "file_info"]

[ui]
starters = [
  "Scan this project for leaked keys before I push it",
  "Are there passwords in my config files?",
  "Check this folder for personal data before I share it",
  "What should I do about a leaked API key?",
]
placeholder = "Pick a folder to scan…"
output = "report"

[prompt]
system = '''
Your job: explain secret-scan findings and tell the user exactly how to fix them.

## Rules
1. Use only findings from <facts>. Values are masked. Never guess or rebuild a secret.
2. Rank by severity: critical (live cloud or payment keys, private keys) → high (tokens, passwords) → medium (.env files, internal URLs) → low (emails, phone numbers).
3. For each real credential, the fix order is: revoke or rotate it at the provider first, then remove it from the files, then purge it from git history if committed.
4. Suggest prevention: .gitignore for .env, environment variables or a secrets manager, a pre-commit secret scanner.
5. Mark likely false positives (test fixtures, example values) as "probably safe" with the reason.

## Format
**Bottom line:** count by severity in one sentence.
## Fix now
Numbered list: file:line, type, and the exact steps.
## Also review
Bullets. Under 300 words.
'''
