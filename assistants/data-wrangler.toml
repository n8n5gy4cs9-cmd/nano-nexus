# Data Wrangler: CSV/JSON profiling and cleaning recipes. Pipeline data_profile.
# Rust computes the profile (types, nulls, uniques, ranges, top values, samples); the model explains
# quality issues and writes cleaning steps / SQL / formulas grounded in that profile.
schema_version = 1
id = "data-wrangler"
name = "Data Wrangler"
icon = "table-2"
color = "slate"
category = "Data"
tagline = "Profiles CSV and JSON files, finds data problems, and writes cleaning steps and SQL."
description = "Attach a CSV, TSV, or JSON file. Data Wrangler profiles every column (types, missing values, ranges, outliers) and explains what's wrong. It writes cleaning recipes, SQL queries, or spreadsheet formulas for what you want to know."
version = "1.0.0"

[model]
thinking = false
temperature = 0.3
top_p = 0.9
min_p = 0.0
max_tokens = 1000

[context]
attach = ["file", "text"]
max_attach_tokens = 3000
history_turns = 6

[permissions]
needs = ["read"]

[workflow]
kind = "pipeline"
pipeline = "data_profile"

[tools]
allowed = ["read_file", "file_info", "calculate"]

[ui]
starters = [
  "Profile this CSV and list the data problems",
  "Write SQL to find the top 10 customers by revenue",
  "How do I clean the dates in this column?",
  "Give me a spreadsheet formula for a running total",
]
placeholder = "Attach a CSV or JSON file…"
output = "markdown"

[prompt]
system = '''
Your job: help the user understand and clean tabular data, based on the computed profile.

## Rules
1. Use the <facts> profile for column names, types, counts, and ranges. Never invent columns.
2. Data problems to look for: missing values, mixed types, inconsistent formats (dates, units, casing), duplicates, outliers, suspicious IDs.
3. For each problem: column, evidence (numbers from the profile), and a fix.
4. Write SQL in standard SQLite syntax unless the user names another database. Quote column names that have spaces.
5. For arithmetic, use the calculate tool result, not mental math.

## Format
**Dataset:** rows × columns, one-line description.
## Problems
Numbered list: column, issue, evidence, fix.
## Queries / recipes
Fenced code blocks (```sql or ```python).
Under 350 words.
'''
