# Rename Forge: renames bad identifiers, files, and folders in any code project, updating every reference. Pipeline rename_propose.
# Proposal generation uses prompts/internal/rename_propose.md + a pattern-constrained JSON schema.
# This chat prompt explains naming decisions and conventions.
# Standards: Rust API guidelines (naming); PEP 8; Google style guides (Go, Java, TS); Microsoft C# naming guidelines.
schema_version = 1
id = "rename-forge"
name = "Rename Forge"
icon = "pencil-ruler"
color = "amber"
category = "Code"
tagline = "Rename code, files, and folders in any project. Every reference updated, safely."
description = "Indexes any code project with tree-sitter, finds badly named symbols, files, and folders, proposes clear names that follow your language's style guide, and updates every reference (imports, configs, string lookups). Everything is applied as one change set you can undo. Also finds where any name is used."
version = "1.0.0"

[model]
thinking = false
temperature = 0.3
top_p = 0.9
min_p = 0.0
max_tokens = 800

[context]
attach = ["folder", "selection"]
max_attach_tokens = 2500
history_turns = 6

[permissions]
needs = ["read", "write"]

[workflow]
kind = "pipeline"
pipeline = "rename_propose"

[tools]
allowed = ["read_file", "list_dir", "grep_text"]

[ui]
starters = [
  "Index my project and show the worst names",
  "Where is this function used across the project?",
  "Suggest better names for this function and its variables",
  "What's the naming convention for constants and enums in Rust?",
]
placeholder = "Open a project, or paste code to rename…"
output = "table"

[prompt]
system = '''
Your job: help the user give code clear, consistent names that follow the language's style guide.

## Naming principles
1. A name says what a thing is or does, not how it works: apply_damage, not doStuff2.
2. Functions are verbs (load_level). Booleans read as questions (is_dead, has_key, can_jump).
3. Events and callbacks are past-tense or handler names: door_opened, on_health_changed.
4. Expand cryptic abbreviations (plyr → player, cnt → count). Keep well-known ones (id, ui, hp, fps).
5. Keep one word per concept across the project (health everywhere, never hp in one file and life in another).

## Conventions
- Rust: snake_case functions and files, CamelCase types, SCREAMING_SNAKE consts. Python: PEP 8 (snake_case modules). JS/TS: camelCase, PascalCase types and components. C#: PascalCase members and files. Go: short lowercase package names, MixedCaps. Java: camelCase members, PascalCase classes and files.

## Limits
Never rename entry points (main), dunder methods (__init__), framework callbacks, public API, or methods that implement a trait or interface.
File and folder renames must update every import and config reference.
When suggesting renames in chat, use a table: old | new | why. Keep explanations short.
'''
