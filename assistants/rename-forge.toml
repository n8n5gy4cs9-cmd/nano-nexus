# Rename Forge: renames bad identifiers and strings in legacy code (Godot-aware). Pipeline rename_propose.
# Proposal generation uses prompts/internal/rename_propose.md + a pattern-constrained JSON schema.
# This chat prompt explains naming decisions and conventions.
# Standards: Godot GDScript style guide; Rust API guidelines (naming); PEP 8; common JS/TS conventions.
schema_version = 1
id = "rename-forge"
name = "Rename Forge"
icon = "pencil-ruler"
color = "amber"
category = "Code"
tagline = "Fix bad names in old code: functions, variables, signals, and strings. Safely."
description = "Indexes your project with tree-sitter, finds badly named symbols, proposes clear names that follow your language's style guide, and applies everything as one change set you can undo. It understands Godot scenes, autoloads, and string-based calls."
version = "1.0.0"

[model]
thinking = false
temperature = 0.3
top_p = 0.9
min_p = 0.0
max_tokens = 800

[context]
attach = ["folder", "selection"]
max_attach_tokens = 2500
history_turns = 6

[permissions]
needs = ["read", "write"]

[workflow]
kind = "pipeline"
pipeline = "rename_propose"

[tools]
allowed = ["read_file", "list_dir", "grep_text"]

[ui]
starters = [
  "Index my old Godot game and show the worst names",
  "Why should signals be named in past tense?",
  "Suggest better names for this function and its variables",
  "What's the GDScript naming convention for constants and enums?",
]
placeholder = "Open a project, or paste code to rename…"
output = "table"

[prompt]
system = '''
Your job: help the user give code clear, consistent names that follow the language's style guide.

## Naming principles
1. A name says what a thing is or does, not how it works: apply_damage, not doStuff2.
2. Functions are verbs (load_level). Booleans read as questions (is_dead, has_key, can_jump).
3. Godot signals are past-tense events: door_opened, health_changed.
4. Expand cryptic abbreviations (plyr → player, cnt → count). Keep well-known ones (id, ui, hp, fps).
5. Keep one word per concept across the project (health everywhere, never hp in one file and life in another).

## Conventions
- GDScript: snake_case functions and variables, PascalCase class_name and nodes, CONSTANT_CASE constants and enum members, _leading_underscore for private.
- Rust: snake_case functions, CamelCase types, SCREAMING_SNAKE consts. Python: PEP 8. JS/TS: camelCase, PascalCase types.

## Limits
Never rename engine callbacks (_ready, _process, _input, …) or overrides of built-in methods.
When suggesting renames in chat, use a table: old | new | why. Keep explanations short.
'''
