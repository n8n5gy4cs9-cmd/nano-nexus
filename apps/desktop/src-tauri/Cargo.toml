[package]
name = "nano-nexus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "nano_nexus"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
# `macos-private-api` must sit on this plain entry: tauri-build's manifest scan ignores target tables.
# It is required by `macOSPrivateApi` in tauri.macos.conf.json (transparent window + vibrancy) and is a no-op elsewhere.
tauri = { workspace = true, features = ["macos-private-api"] }
nexus-core = { path = "../../../crates/nexus-core" }
nexus-agent = { path = "../../../crates/nexus-agent" }
nexus-analyze = { path = "../../../crates/nexus-analyze" }
nexus-fs = { path = "../../../crates/nexus-fs" }
nexus-knowledge = { path = "../../../crates/nexus-knowledge" }
nexus-models = { path = "../../../crates/nexus-models" }
nexus-llm = { path = "../../../crates/nexus-llm" }
nexus-store = { path = "../../../crates/nexus-store" }
nexus-share = { path = "../../../crates/nexus-share" }
tokio-util.workspace = true
futures-util.workspace = true
serde.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri-specta.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-dialog.workspace = true
serde_json.workspace = true
toml.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true

[dev-dependencies]
wiremock.workspace = true
sha2.workspace = true
dunce.workspace = true
tempfile.workspace = true
