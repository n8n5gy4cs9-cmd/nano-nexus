<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b6bff"/>
      <stop offset="1" stop-color="#5fd8f0"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#241f3d"/>
      <stop offset="1" stop-color="#0b0a16"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <!-- hexagonal nexus ring -->
  <polygon points="512,262 728.5,387 728.5,637 512,762 295.5,637 295.5,387" fill="none" stroke="url(#ring)" stroke-width="34" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- spokes to the core, faint -->
  <g stroke="#8aa2ff" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round">
    <line x1="512" y1="512" x2="512" y2="262"/><line x1="512" y1="512" x2="728.5" y2="387"/>
    <line x1="512" y1="512" x2="728.5" y2="637"/><line x1="512" y1="512" x2="512" y2="762"/>
    <line x1="512" y1="512" x2="295.5" y2="637"/><line x1="512" y1="512" x2="295.5" y2="387"/>
  </g>
  <circle cx="512" cy="512" r="46" fill="url(#ring)" filter="url(#glow)"/>
</svg>
