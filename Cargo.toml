[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

# Smaller debug builds: keep line tables for backtraces, drop debuginfo of dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
todo = "warn"

# Shared dependency pins. Later milestones add their crates here, never in member Cargo.tomls directly.
[workspace.dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs", "io-util"] }
tokio-util = "0.7.20"
notify = "8.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.28", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "macros", "local-offset"] }
tracing = "0.1"
tempfile = "3"
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] } # loopback HTTP only, no TLS needed
futures-util = "0.3"
bytes = "1"
secrecy = "0.10"
getrandom = "0.4"
axum = "0.8"
nix = { version = "0.30", default-features = false } # safe SIGTERM / killpg (unsafe_code is forbidden)
win32job = "2" # Windows Job Object (KILL_ON_JOB_CLOSE) for llama-server, ADR-014
sysinfo = { version = "0.39", default-features = false, features = ["system"] } # verify a stale server pid still belongs to our llama-server before killing
tauri = "2.12" # never 3.x (ADR-001)
tauri-build = "2.7"
rusqlite = { version = "0.40", features = ["bundled"] } # bundled SQLite incl. FTS5 (DATA-AND-IPC §1)
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] } # ADR-006; exact pin during the rc period
specta-typescript = "=0.0.12"
tauri-plugin-notification = "2.6" # OS notifications (ADR-001 plugin set); 2.x only
minijinja = { version = "3", features = ["serde"] } # assistant prompt templates (ASSISTANTS §2)
toml = "1" # assistant definitions are TOML (ADR-011)
insta = "1" # snapshot tests for rendered prompts (dev)
tauri-plugin-opener = "2" # open https links in the OS browser (never inside the webview)
tauri-plugin-dialog = "2" # native file picker for attachments
dunce = "1" # canonical paths without the \\?\ prefix on Windows (PERMISSIONS §3)
similar = "2" # unified diffs for change-set previews
blake3 = "1" # content hashes for change-set base/post hashes
trash = "5" # move to the system Trash / Recycle Bin (never delete)
proptest = "1" # property tests for apply/undo
walkdir = "2"
jsonschema = { version = "0.33", default-features = false } # validate assistant TOML (as JSON) against schemas/assistant.schema.json
include_dir = "0.7" # embed assistants/*.toml in the binary (ASSISTANTS §1)
async-trait = "0.1" # object-safe async Tool trait (ASSISTANTS §5)
sha2 = "0.10" # streaming SHA-256 of downloaded model files (MODEL-MANAGER §4)
regex = "1" # catalog `file_pattern` matching against a repo's file list
wiremock = "0.6" # fake Hugging Face server in tests (dev)
ignore = "0.4" # parallel, gitignore-aware directory walker (folder scans)
rayon = "1" # parallel hashing of duplicate candidates
infer = "0.19" # magic-byte file type detection
pdf-extract = "0.9" # PDF text extraction (spike S5); run under catch_unwind, pdftotext fallback
zip = { version = "2", default-features = false, features = ["deflate"] } # DOCX reading and zip-archive reports
quick-xml = "0.37" # DOCX word/document.xml parsing
csv = "1" # streaming CSV/TSV profiling
kamadak-exif = "0.6" # image EXIF facts (date, camera, GPS flag)
whatlang = "0.16" # language guess for text reports
qrcode = { version = "0.14", default-features = false, features = ["svg"] } # pairing QR as an SVG string (LAN-SHARE §2)
if-addrs = "0.13" # LAN IPv4 discovery for the share URLs
mdns-sd = "0.13" # Bonjour advertising as nanonexus.local (LAN Share)
rcgen = "0.13" # self-signed certificate for optional HTTPS (LAN Share)
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] } # TLS listener for axum
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] } # ring provider: no C toolchain needed, cross-compiles to Windows
# M09 Rename Forge: code parsing (spike S4: all grammars load with tree-sitter 0.27)
tree-sitter = "0.27"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-swift = "0.7"
tree-sitter-php = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-lua = "0.5"
postcard = { version = "1.1", default-features = false, features = ["use-std"] } # compact on-disk code index (M09 index.bin)
heck = "0.5" # case conversion for Rename Forge naming rules (M09)
