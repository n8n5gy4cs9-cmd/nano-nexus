[workspace]
resolver = "3"
members = ["crates/*"] # apps/desktop/src-tauri is added in M03

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
todo = "warn"

# Shared dependency pins. Later milestones add their crates here, never in member Cargo.tomls directly.
[workspace.dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs", "io-util"] }
tokio-util = "0.7.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.28", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "macros"] }
tracing = "0.1"
tempfile = "3"
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] } # loopback HTTP only, no TLS needed
futures-util = "0.3"
bytes = "1"
secrecy = "0.10"
getrandom = "0.4"
axum = "0.8"
nix = { version = "0.30", default-features = false } # safe SIGTERM / killpg (unsafe_code is forbidden)
win32job = "2" # Windows Job Object (KILL_ON_JOB_CLOSE) for llama-server, ADR-014
