[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

# Smaller debug builds: keep line tables for backtraces, drop debuginfo of dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
todo = "warn"

# Shared dependency pins. Later milestones add their crates here, never in member Cargo.tomls directly.
[workspace.dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs", "io-util"] }
tokio-util = "0.7.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.28", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "macros"] }
tracing = "0.1"
tempfile = "3"
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] } # loopback HTTP only, no TLS needed
futures-util = "0.3"
bytes = "1"
secrecy = "0.10"
getrandom = "0.4"
axum = "0.8"
nix = { version = "0.30", default-features = false } # safe SIGTERM / killpg (unsafe_code is forbidden)
win32job = "2" # Windows Job Object (KILL_ON_JOB_CLOSE) for llama-server, ADR-014
sysinfo = { version = "0.39", default-features = false, features = ["system"] } # verify a stale server pid still belongs to our llama-server before killing
tauri = "2.12" # never 3.x (ADR-001)
tauri-build = "2.7"
rusqlite = { version = "0.40", features = ["bundled"] } # bundled SQLite incl. FTS5 (DATA-AND-IPC §1)
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] } # ADR-006; exact pin during the rc period
specta-typescript = "=0.0.12"
tauri-plugin-notification = "2.6" # OS notifications (ADR-001 plugin set); 2.x only
minijinja = { version = "3", features = ["serde"] } # assistant prompt templates (ASSISTANTS §2)
toml = "1" # assistant definitions are TOML (ADR-011)
insta = "1" # snapshot tests for rendered prompts (dev)
tauri-plugin-opener = "2" # open https links in the OS browser (never inside the webview)
tauri-plugin-dialog = "2" # native file picker for attachments
dunce = "1" # canonical paths without the \\?\ prefix on Windows (PERMISSIONS §3)
similar = "2" # unified diffs for change-set previews
blake3 = "1" # content hashes for change-set base/post hashes
trash = "5" # move to the system Trash / Recycle Bin (never delete)
proptest = "1" # property tests for apply/undo
walkdir = "2"
jsonschema = { version = "0.33", default-features = false } # validate assistant TOML (as JSON) against schemas/assistant.schema.json
include_dir = "0.7" # embed assistants/*.toml in the binary (ASSISTANTS §1)
async-trait = "0.1" # object-safe async Tool trait (ASSISTANTS §5)
