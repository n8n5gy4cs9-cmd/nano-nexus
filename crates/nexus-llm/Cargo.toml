[package]
name = "nexus-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Builds the `mock-llama` test binary (a fake llama-server). Enabled for tests via the self dev-dependency.
test-mock = ["dep:axum"]

[[bin]]
name = "mock-llama"
path = "tests/bin/mock_llama.rs"
required-features = ["test-mock"]

[dependencies]
axum = { workspace = true, optional = true }
nexus-core = { path = "../nexus-core" }
bytes.workspace = true
futures-util.workspace = true
getrandom.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-util.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "process"] }

[target.'cfg(windows)'.dependencies]
win32job.workspace = true

[dev-dependencies]
nexus-llm = { path = ".", features = ["test-mock"] }
tempfile.workspace = true
